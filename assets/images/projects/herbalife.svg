<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Vista previa del Portal Herbalife">
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130c"/>
      <stop offset="1" stop-color="#0d2417"/>
    </linearGradient>
    <radialGradient id="hb-glow" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#hb-bg)"/>
  <rect width="640" height="400" fill="url(#hb-glow)"/>

  <!-- Barra de navegador -->
  <rect width="640" height="46" fill="#050d09"/>
  <circle cx="26" cy="23" r="5.5" fill="#f87171"/>
  <circle cx="48" cy="23" r="5.5" fill="#fbbf24"/>
  <circle cx="70" cy="23" r="5.5" fill="#34d399"/>
  <rect x="100" y="12" width="440" height="22" rx="11" fill="#0f2118"/>
  <text x="116" y="27" font-family="ui-monospace, monospace" font-size="11" fill="#7fb794">herbalife.finkok.com/iniciar-sesion</text>

  <!-- Tarjeta de login centrada -->
  <rect x="190" y="78" width="260" height="288" rx="18" fill="#0a1a11" stroke="#1c4530"/>
  <circle cx="320" cy="128" r="26" fill="#22c55e" opacity="0.18"/>
  <path d="M320 114c-8 8-8 20 0 28 8-8 8-20 0-28z M306 136c10 2 18 0 14-8M334 136c-10 2-18 0-14-8" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="320" y="180" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#e4f5ea" text-anchor="middle">Iniciar sesión</text>
  <text x="320" y="200" font-family="system-ui, sans-serif" font-size="10.5" fill="#6f9c80" text-anchor="middle">Portal corporativo CFDI</text>

  <rect x="216" y="222" width="208" height="34" rx="9" fill="#0f2418" stroke="#24523a"/>
  <text x="232" y="243" font-family="system-ui, sans-serif" font-size="11" fill="#5d8a6d">usuario@herbalife.com</text>
  <rect x="216" y="266" width="208" height="34" rx="9" fill="#0f2418" stroke="#24523a"/>
  <text x="232" y="287" font-family="ui-monospace, monospace" font-size="12" fill="#5d8a6d">••••••••••</text>
  <rect x="216" y="314" width="208" height="36" rx="18" fill="url(#hb-accent)"/>
  <text x="320" y="337" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#04140a" text-anchor="middle">Entrar al portal</text>

  <!-- Detalles laterales -->
  <rect x="470" y="120" width="120" height="10" rx="5" fill="#14301f"/>
  <rect x="470" y="140" width="88" height="10" rx="5" fill="#0f2418"/>
  <rect x="50" y="120" width="120" height="10" rx="5" fill="#14301f"/>
  <rect x="84" y="140" width="86" height="10" rx="5" fill="#0f2418"/>
</svg>
