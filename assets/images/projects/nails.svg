<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Vista previa de Angie Solis Nails Studio">
  <defs>
    <linearGradient id="nails-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a10"/>
      <stop offset="1" stop-color="#241019"/>
    </linearGradient>
    <radialGradient id="nails-glow" cx="0.8" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ec6d9d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ec6d9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nails-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f38fb5"/>
      <stop offset="1" stop-color="#d1447b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#nails-bg)"/>
  <rect width="640" height="400" fill="url(#nails-glow)"/>

  <!-- Barra de navegador -->
  <rect x="0" y="0" width="640" height="46" fill="#0d070b"/>
  <circle cx="26" cy="23" r="5.5" fill="#f87171"/>
  <circle cx="48" cy="23" r="5.5" fill="#fbbf24"/>
  <circle cx="70" cy="23" r="5.5" fill="#34d399"/>
  <rect x="100" y="12" width="440" height="22" rx="11" fill="#1e1018"/>
  <text x="116" y="27" font-family="ui-monospace, monospace" font-size="11" fill="#b98aa0">ajsantiago02.github.io/nails</text>

  <!-- Hero del sitio -->
  <text x="48" y="118" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#fbe4ec">Angie Solis</text>
  <text x="48" y="152" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#ec6d9d">Nails Studio</text>
  <rect x="48" y="172" width="200" height="10" rx="5" fill="#3a2230"/>
  <rect x="48" y="190" width="150" height="10" rx="5" fill="#3a2230"/>
  <rect x="48" y="220" width="132" height="32" rx="16" fill="url(#nails-accent)"/>
  <text x="114" y="241" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Reservar cita</text>

  <!-- Tarjetas de servicios -->
  <g>
    <rect x="360" y="90" width="104" height="120" rx="12" fill="#1d1019" stroke="#40242f"/>
    <circle cx="412" cy="126" r="18" fill="#ec6d9d" opacity="0.25"/>
    <circle cx="412" cy="126" r="9" fill="#ec6d9d"/>
    <rect x="380" y="158" width="64" height="8" rx="4" fill="#3a2230"/>
    <rect x="388" y="174" width="48" height="8" rx="4" fill="#2c1a24"/>
  </g>
  <g>
    <rect x="484" y="90" width="104" height="120" rx="12" fill="#1d1019" stroke="#40242f"/>
    <circle cx="536" cy="126" r="18" fill="#fbbf24" opacity="0.25"/>
    <circle cx="536" cy="126" r="9" fill="#fbbf24"/>
    <rect x="504" y="158" width="64" height="8" rx="4" fill="#3a2230"/>
    <rect x="512" y="174" width="48" height="8" rx="4" fill="#2c1a24"/>
  </g>

  <!-- Galería inferior -->
  <rect x="48" y="286" width="128" height="78" rx="10" fill="#241019" stroke="#40242f"/>
  <rect x="192" y="286" width="128" height="78" rx="10" fill="#ec6d9d" opacity="0.16"/>
  <rect x="336" y="286" width="128" height="78" rx="10" fill="#241019" stroke="#40242f"/>
  <rect x="480" y="286" width="128" height="78" rx="10" fill="#ec6d9d" opacity="0.1"/>
</svg>
