<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Vista previa de Finkok PDF">
  <defs>
    <linearGradient id="pdf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131a"/>
      <stop offset="1" stop-color="#0d2230"/>
    </linearGradient>
    <radialGradient id="pdf-glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pdf-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#pdf-bg)"/>
  <rect width="640" height="400" fill="url(#pdf-glow)"/>

  <!-- Barra de navegador -->
  <rect width="640" height="46" fill="#060d12"/>
  <circle cx="26" cy="23" r="5.5" fill="#f87171"/>
  <circle cx="48" cy="23" r="5.5" fill="#fbbf24"/>
  <circle cx="70" cy="23" r="5.5" fill="#34d399"/>
  <rect x="100" y="12" width="440" height="22" rx="11" fill="#0f1f2a"/>
  <text x="116" y="27" font-family="ui-monospace, monospace" font-size="11" fill="#7fb7c9">pdf.finkok.com</text>

  <!-- Panel izquierdo: upload CFDI -->
  <rect x="48" y="84" width="260" height="280" rx="14" fill="#0b1a24" stroke="#14404f"/>
  <rect x="72" y="110" width="212" height="96" rx="10" fill="#0d2230" stroke="#1d5a6e" stroke-dasharray="6 5"/>
  <path d="M178 146v26m0-26l-10 10m10-10l10 10" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="178" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#7fb7c9" text-anchor="middle">Arrastra tu XML · CFDI 4.0</text>
  <rect x="72" y="226" width="212" height="12" rx="6" fill="#123444"/>
  <rect x="72" y="226" width="150" height="12" rx="6" fill="url(#pdf-accent)"/>
  <rect x="72" y="254" width="212" height="12" rx="6" fill="#123444"/>
  <rect x="72" y="282" width="212" height="12" rx="6" fill="#123444"/>
  <rect x="72" y="314" width="140" height="30" rx="15" fill="url(#pdf-accent)"/>
  <text x="142" y="334" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#04222b" text-anchor="middle">Generar PDF</text>

  <!-- Documento PDF resultante -->
  <g transform="rotate(3 470 220)">
    <rect x="380" y="90" width="190" height="270" rx="10" fill="#f4fafc"/>
    <rect x="380" y="90" width="190" height="34" rx="10" fill="#06b6d4"/>
    <text x="396" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">FACTURA · CFDI 4.0</text>
    <rect x="396" y="140" width="110" height="9" rx="4" fill="#cbdde4"/>
    <rect x="396" y="158" width="140" height="9" rx="4" fill="#dfeaf0"/>
    <rect x="396" y="186" width="158" height="9" rx="4" fill="#dfeaf0"/>
    <rect x="396" y="204" width="130" height="9" rx="4" fill="#dfeaf0"/>
    <rect x="396" y="222" width="150" height="9" rx="4" fill="#dfeaf0"/>
    <rect x="396" y="250" width="158" height="1.5" fill="#cbdde4"/>
    <rect x="498" y="268" width="56" height="56" rx="6" fill="#0b1a24"/>
    <path d="M506 276h12v12h-12zM530 276h16v4h-16zM530 284h10v4h-10zM506 296h8v8h-8zM518 296h12v4h-12zM506 308h24v8h-24z" fill="#22d3ee"/>
    <text x="400" y="302" font-family="ui-monospace, monospace" font-size="10" fill="#5b7c8a">TFD · QR verificado</text>
  </g>
</svg>
